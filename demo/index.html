<small>LOCAL VALIDATION · 不會連線到 MSA，也不是對局錄製結果</small>
<h1>手牌與公開 Log：驗證面板</h1>
<p>以合成資料模擬 MSA 容器、卡片正反面與公開日誌結構，驗證手牌保存、回合分段、重複出牌及關閉後重新匯入。日誌擷取時間不代表事件發生時間。</p>
<div><button id="run-tests">執行瀏覽器驗證</button><button id="draw">模擬抽牌</button><button id="switch">切換回合</button><button id="empty">清空手牌</button><button id="reset">重設測試場景</button><button id="open-log" class="_logButton_fixture">開啟模擬 Log</button><button id="close-log">關閉模擬 Log</button></div>
<section class="panel" id="board">
<div class="_playerInfoContainer_fixture player"><span class="_playerInfoBadge_fixture">測試對手</span><span class="_playerInfoPhase_fixture"></span></div>
<div class="_handContainer_fixture cards" id="opponent-hand"></div>
<div class="_gridContainer_fixture top"><div class="_battleAreaBox_fixture" style="z-index:9"></div></div>
<div class="_gridContainer_fixture"><div class="_battleAreaBox_fixture" style="z-index:10"></div><button>Lv. 5 • 4</button></div>
<div class="_playerInfoContainer_fixture player"><span class="_playerInfoBadge_fixture">測試玩家</span><span class="_playerInfoPhase_fixture">MAIN</span></div>
<div class="_handContainer_fixture cards" id="own-hand"></div>
</section>
<section class="panel"><label>讀取結果</label><pre id="reading"></pre><label>驗證紀錄</label><ol id="results"></ol></section>
